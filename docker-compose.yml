# HireSphere — docker-compose.yml
# Local equivalent of AWS CloudFormation stack
# Maps to: ECS services, RDS, ALB/API Gateway, Cognito
#
# AWS Mapping:
#   auth-service     → ECS Fargate task + AWS Cognito (User Pools)
#   booking-service  → ECS Fargate task
#   interview-service→ ECS Fargate task (with WebSocket support)
#   nginx            → AWS Application Load Balancer / API Gateway
#   frontend         → AWS Amplify (React hosting)

networks:
  hiresphere-net:
    driver: bridge

volumes:
  auth-db:
  booking-db:
  interview-db:

services:

  # ── Auth Service (AWS Cognito equivalent) ──────────────
  auth-service:
    build: ./auth-service
    container_name: hiresphere-auth
    environment:
      - SECRET_KEY=hiresphere-prod-secret-change-me
      - DATABASE_URL=sqlite:////data/auth.db
      - FLASK_DEBUG=0
      - COGNITO_USER_POOL_ID=us-east-1_ogGrgkt1q
      - COGNITO_APP_CLIENT_ID=34isv5k5ht4tpabm961gr56v60
      - AWS_REGION=us-east-1
    volumes:
      - auth-db:/data
    ports:
      - "5001:5001"
    networks:
      - hiresphere-net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Booking Service ────────────────────────────────────
  booking-service:
    build: ./booking-service
    container_name: hiresphere-booking
    environment:
      - SECRET_KEY=hiresphere-prod-secret-change-me
      - DATABASE_URL=sqlite:////data/booking.db
      - AUTH_SERVICE_URL=http://auth-service:5001
      - COGNITO_USER_POOL_ID=us-east-1_ogGrgkt1q
      - COGNITO_APP_CLIENT_ID=34isv5k5ht4tpabm961gr56v60
      - AWS_REGION=us-east-1
      - FLASK_DEBUG=0
    volumes:
      - booking-db:/data
    ports:
      - "5002:5002"
    networks:
      - hiresphere-net
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Interview + Feedback Service (WebSocket) ──────────
  interview-service:
    build: ./interview-service
    container_name: hiresphere-interview
    environment:
      - SECRET_KEY=hiresphere-prod-secret-change-me
      - DATABASE_URL=sqlite:////data/interview.db
      - UPLOAD_DIR=/data/uploads
      - COGNITO_USER_POOL_ID=us-east-1_ogGrgkt1q
      - COGNITO_APP_CLIENT_ID=34isv5k5ht4tpabm961gr56v60
      - AWS_REGION=us-east-1
      - FLASK_DEBUG=0
    volumes:
      - interview-db:/data
    ports:
      - "5003:5003"
    networks:
      - hiresphere-net
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5003/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  # ── API Gateway (AWS API Gateway / ALB equivalent) ────
  api-gateway:
    image: nginx:alpine
    container_name: hiresphere-gateway
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    networks:
      - hiresphere-net
    depends_on:
      - auth-service
      - booking-service
      - interview-service
    restart: unless-stopped
