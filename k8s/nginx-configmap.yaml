apiVersion: v1
kind: ConfigMap
metadata:
  name: hiresphere-gateway-config
  namespace: hiresphere
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        upstream auth_service {
            server auth-service:5001;
        }
        upstream booking_service {
            server booking-service:5002;
        }
        upstream interview_service {
            server interview-service:5003;
        }
        server {
            listen 80;
            server_name _;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            location /health {
                return 200 '{"gateway":"ok"}';
                add_header Content-Type application/json;
            }
            location /auth/ {
                if ($request_method = OPTIONS) { return 204; }
                proxy_pass http://auth_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
            location /auth/users {
                if ($request_method = OPTIONS) { return 204; }
                proxy_pass http://auth_service;
                proxy_set_header Host $host;
            }
            location /bookings {
                if ($request_method = OPTIONS) { return 204; }
                proxy_pass http://booking_service;
                proxy_set_header Host $host;
                proxy_set_header Authorization $http_authorization;
            }
            location /feedback {
                if ($request_method = OPTIONS) { return 204; }
                proxy_pass http://interview_service;
                proxy_set_header Host $host;
                proxy_set_header Authorization $http_authorization;
            }
            location /submissions {
                if ($request_method = OPTIONS) { return 204; }
                proxy_pass http://interview_service;
                proxy_set_header Host $host;
                proxy_set_header Authorization $http_authorization;
                client_max_body_size 25m;
            }
            location /messages {
                if ($request_method = OPTIONS) { return 204; }
                proxy_pass http://interview_service;
                proxy_set_header Host $host;
                proxy_set_header Authorization $http_authorization;
            }
            location /ratings/ {
                if ($request_method = OPTIONS) { return 204; }
                proxy_pass http://interview_service;
                proxy_set_header Host $host;
                proxy_set_header Authorization $http_authorization;
            }
            location /packages {
                if ($request_method = OPTIONS) { return 204; }
                proxy_pass http://booking_service;
                proxy_set_header Host $host;
                proxy_set_header Authorization $http_authorization;
            }
            location /socket.io/ {
                proxy_pass http://interview_service;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
            }
            location / {
                return 200 '{"message":"HireSphere API Gateway","services":["auth","booking","interview"]}';
                add_header Content-Type application/json;
            }
        }
    }
