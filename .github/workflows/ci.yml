# HireSphere CI — build & test (GitHub integration for assignment / viva)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-microservices:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, booking-service, interview-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t hiresphere/${{ matrix.service }}:ci ./${{ matrix.service }}
